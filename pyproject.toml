[project]
name = "pyflam"
version = "0.0.1"
description = "A NumPy/SciPy re-implementation of Ken Ho's GPL FLAM hierarchical matrix routines."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Haiya" },
]
keywords = [
    "FLAM",
    "hierarchical matrices",
    "recursive skeletonization",
    "multifrontal factorization",
    "interpolative decomposition",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.urls]
"Upstream FLAM" = "https://github.com/klho/FLAM"
"Upstream ChunkIE" = "https://github.com/fastalgorithms/chunkie"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyflam"]

[tool.pyflam.test-reference-dependencies.flam]
name = "FLAM"
url = "https://github.com/klho/FLAM.git"
commit = "b928b2b1b4e0c3a00558bcdc7e3147fe83e720c4"
describe = "v1.1.0-23-gb928b2b"
required_clean = true

[tool.pyflam.test-reference-dependencies.chunkie]
name = "ChunkIE"
url = "https://github.com/fastalgorithms/chunkie.git"
commit = "af34cc41c81114e693b515066e4d308067bf7e63"
describe = "v1.0.1-docs-232-gaf34cc4"
required_clean = true
