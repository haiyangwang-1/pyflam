[project]
name = "pyflam"
version = "0.1.0"
description = "A minimal NumPy/SciPy port of core FLAM hierarchical matrix routines."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyflam"]
